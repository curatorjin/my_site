<!DOCTYPE html>
<html lang="{{ site.lang | default: "zh-CN" }}">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.title %}
<title>{{page.title}}</title>
{% else %}
<title>{{site.title}}</title>
{% endif %}
{% assign asset_version = site.time | date: '%Y%m%d%H' %}
<link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" type="image/png" />
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}" />
<link rel="stylesheet"
    href="{{ '/assets/css/style.css?v=' | append: asset_version | relative_url }}">
<script defer
    src="{{ '/assets/scripts/function.js?v=' | append: asset_version | relative_url }}"></script>
{%- if page.mermaid -%}
<script src="{{ '/assets/scripts/mermaid.min.js' | relative_url }}"></script>
<script>document.addEventListener('DOMContentLoaded', function () { mermaid.initialize({ startOnLoad: true }); });</script>
{%- endif -%}
</head>
